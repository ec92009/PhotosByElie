<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Photos By Elie | Portugal Gallery</title>
  <meta http-equiv="refresh" content="0; url=./gallery.html?gallery=portugal"/>
  <link rel="canonical" href="./gallery.html?gallery=portugal"/>
  <script>
    const target = new URL("./gallery.html", window.location.href);
    target.searchParams.set("gallery", "portugal");
    const version = new URLSearchParams(window.location.search).get("v");
    if (version) target.searchParams.set("v", version);
    window.location.replace(`${target.href}${window.location.hash}`);
  </script>
</head>
<body>
  <p><a href="./gallery.html?gallery=portugal">Open the Portugal gallery</a>.</p>
</body>
</html>
