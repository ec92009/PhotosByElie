name = "photosbyelie-checkout-mock"
main = "worker/deployed-worker.mjs"
compatibility_date = "2026-05-08"

[vars]
PUBLIC_SITE_URL = "https://ec92009.github.io/PhotosByElie"
MOCK_STRIPE_ENABLED = "true"
KV_PREFIX = "pbe"

[[kv_namespaces]]
binding = "ORDERS_KV"
id = "0ea4d21c491246c986c2c0308bebc560"
preview_id = "0896fcb030ac4f54b43756707a11a6e0"

[[r2_buckets]]
binding = "PRIVATE_MEDIA"
bucket_name = "photosbyelie-private"
preview_bucket_name = "photosbyelie-private"

[[r2_buckets]]
binding = "DELIVERY_MEDIA"
bucket_name = "photosbyelie-private"
preview_bucket_name = "photosbyelie-private"
