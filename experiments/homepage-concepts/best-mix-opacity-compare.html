<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta http-equiv="Cache-Control" content="no-store"/>
  <meta http-equiv="Pragma" content="no-cache"/>
  <meta http-equiv="Expires" content="0"/>
  <title>Photos By Elie | Best Mix Glass Compare</title>
  <link rel="icon" type="image/png" sizes="512x512" href="../../assets/byelie-logo.png"/>
  <style>
    :root{
      color-scheme:dark;
      font-family:"Space Grotesk",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:#080808;
      color:#f6f2ea;
    }

    *{
      box-sizing:border-box;
    }

    html,
    body{
      min-height:100%;
      margin:0;
    }

    body{
      display:grid;
      grid-template-rows:auto minmax(0,1fr);
      height:100dvh;
      overflow:hidden;
    }

    .compare-toolbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      padding:12px 16px;
      border-bottom:1px solid rgba(255,255,255,.14);
      background:rgba(8,8,8,.94);
    }

    .compare-toolbar a{
      color:inherit;
      font-weight:800;
      text-decoration:none;
    }

    .compare-toolbar small{
      color:rgba(246,242,234,.7);
      font-size:.82rem;
      font-weight:800;
    }

    .compare-title{
      display:grid;
      gap:2px;
      min-width:190px;
    }

    .compare-controls{
      display:grid;
      grid-template-columns:repeat(2,minmax(210px,1fr));
      gap:12px;
      width:min(620px,100%);
    }

    .compare-control{
      display:grid;
      gap:6px;
      min-width:0;
      color:#fff;
      font-size:.78rem;
      font-weight:900;
      letter-spacing:.03em;
    }

    .compare-control span{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }

    .compare-control output{
      min-width:4ch;
      color:rgba(246,242,234,.78);
      text-align:right;
    }

    .compare-control input{
      width:100%;
      accent-color:#f6f2ea;
    }

    .compare-grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      min-height:0;
    }

    .compare-pane{
      position:relative;
      min-width:0;
      min-height:0;
      border-right:1px solid rgba(255,255,255,.16);
      background:#111;
    }

    .compare-pane:last-child{
      border-right:0;
    }

    .compare-label{
      position:absolute;
      z-index:2;
      top:12px;
      left:12px;
      display:grid;
      gap:2px;
      min-height:32px;
      padding:6px 10px;
      border:1px solid rgba(255,255,255,.28);
      border-radius:999px;
      background:rgba(8,8,8,.72);
      color:#fff;
      font-size:.76rem;
      font-weight:900;
      letter-spacing:.06em;
      text-transform:uppercase;
      backdrop-filter:blur(10px);
    }

    .compare-label span{
      color:rgba(255,255,255,.74);
      font-size:.64rem;
      letter-spacing:.04em;
    }

    iframe{
      display:block;
      width:100%;
      height:100%;
      border:0;
      background:#111;
    }

    @media (max-width:820px){
      body{
        height:auto;
        min-height:100dvh;
        overflow:auto;
      }

      .compare-toolbar{
        align-items:flex-start;
        flex-direction:column;
      }

      .compare-controls{
        grid-template-columns:1fr;
      }

      .compare-grid{
        grid-template-columns:1fr;
      }

      .compare-pane{
        height:86dvh;
        border-right:0;
        border-bottom:1px solid rgba(255,255,255,.16);
      }
    }
  </style>
</head>
<body>
  <header class="compare-toolbar">
    <div class="compare-title">
      <a href="./index.html">Best Mix glass compare</a>
      <small>Left is current. Sliders tune the right pane.</small>
    </div>
    <div class="compare-controls" aria-label="Right pane controls">
      <label class="compare-control">
        <span>Opacity <output data-opacity-output for="best-mix-opacity">80%</output></span>
        <input id="best-mix-opacity" type="range" min="0" max="100" step="1" value="80" autocomplete="off" data-opacity-slider/>
      </label>
      <label class="compare-control">
        <span>Frosting <output data-frosting-output for="best-mix-frosting">25%</output></span>
        <input id="best-mix-frosting" type="range" min="0" max="100" step="1" value="25" autocomplete="off" data-frosting-slider/>
      </label>
    </div>
  </header>
  <main class="compare-grid">
    <section class="compare-pane" aria-label="Current Best Mix">
      <div class="compare-label">Current<span>Opacity 100% / Frosting 100%</span></div>
      <iframe title="Current Best Mix" src="./best-mix.html?compare=current&fresh=29"></iframe>
    </section>
    <section class="compare-pane" aria-label="Tuned Best Mix">
      <div class="compare-label">Tuned<span data-tuned-label>Opacity 80% / Frosting 25%</span></div>
      <iframe title="Tuned Best Mix" data-tuned-frame src="./best-mix.html?cardOpacity=80&frosting=25&compare=tuned&fresh=29"></iframe>
    </section>
  </main>
  <script>
    (() => {
      const opacitySlider = document.querySelector("[data-opacity-slider]");
      const frostingSlider = document.querySelector("[data-frosting-slider]");
      const opacityOutput = document.querySelector("[data-opacity-output]");
      const frostingOutput = document.querySelector("[data-frosting-output]");
      const tunedLabel = document.querySelector("[data-tuned-label]");
      const tunedFrame = document.querySelector("[data-tuned-frame]");
      const base = {
        "--best-mix-topbar-alpha": .17,
        "--best-mix-control-alpha": .23,
        "--best-mix-panel-alpha": .19,
        "--best-mix-card-alpha": .26,
        "--best-mix-card-hover-alpha": .32,
        "--best-mix-pill-alpha": .34,
      };
      const params = new URLSearchParams(window.location.search);
      const clamp = (value, fallback) => {
        if (value === null || value === "") return fallback;
        const parsed = Number(value);
        return Number.isFinite(parsed) ? Math.min(100, Math.max(0, parsed)) : fallback;
      };
      opacitySlider.value = String(clamp(params.get("opacity"), 80));
      frostingSlider.value = String(clamp(params.get("frosting"), 25));

      const writeTuning = () => {
        const opacity = clamp(opacitySlider.value, 80);
        const frosting = clamp(frostingSlider.value, 25);
        opacityOutput.textContent = `${opacity}%`;
        frostingOutput.textContent = `${frosting}%`;
        tunedLabel.textContent = `Opacity ${opacity}% / Frosting ${frosting}%`;

        const doc = tunedFrame.contentDocument;
        if (!doc?.documentElement) return;
        const root = doc.documentElement;
        root.dataset.bestMixTuned = "true";
        root.dataset.bestMixCardOpacity = String(opacity);
        root.dataset.bestMixFrosting = String(frosting);
        Object.entries(base).forEach(([name, value]) => {
          root.style.setProperty(name, String(Number((value * opacity / 100).toFixed(4))));
        });
        root.style.setProperty("--best-mix-heavy-blur", `${10 * frosting / 100}px`);
        root.style.setProperty("--best-mix-light-blur", `${8 * frosting / 100}px`);
      };

      const syncFrameUrl = () => {
        const opacity = clamp(opacitySlider.value, 80);
        const frosting = clamp(frostingSlider.value, 25);
        tunedFrame.src = `./best-mix.html?cardOpacity=${opacity}&frosting=${frosting}&compare=tuned&fresh=29`;
      };

      opacitySlider.addEventListener("input", writeTuning);
      frostingSlider.addEventListener("input", writeTuning);
      tunedFrame.addEventListener("load", writeTuning);
      syncFrameUrl();
      writeTuning();
    })();
  </script>
</body>
</html>
