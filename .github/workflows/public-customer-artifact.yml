name: Public customer artifact

on:
  pull_request:
  push:
    branches: [main, 'codex/**', 't3/**']
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-customer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  customer-artifact:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Existing Python image-test dependency
        run: python -m pip install 'Pillow==12.3.0'
      - name: Integrated catalog, SEO, resilience, and fulfillment regressions
        run: |
          if test -f scripts/public_gallery_startup.test.mjs; then
            node --test scripts/public_gallery_startup.test.mjs
          fi
          if test -f scripts/customer_resilience.test.mjs; then
            node --test scripts/customer_resilience.test.mjs
          fi
          if test -f scripts/build_public_seo.mjs; then
            node --test scripts/build_public_seo.test.mjs
          fi
          if test -f worker/paid-order-fulfillment.test.mjs; then
            node --test worker/paid-order-fulfillment.test.mjs
          fi
      - name: Customer, checkout, lifecycle, and artifact regressions
        run: npm test
      - name: Generated API contract
        run: npm run contract:check
      - name: Fetch live visible media IDs for public SEO overlay
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: |
          curl -fsSL https://auth.photos-by-elie.com/lifecycle/visible -o "$RUNNER_TEMP/visible-ids.json"
          node -e '
            const fs = require("node:fs");
            const data = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/visible-ids.json", "utf8"));
            if (!data.ok || !Array.isArray(data.visibleMediaIds) || data.visibleMediaIds.length < 100) {
              throw new Error("Invalid live visibleMediaIds payload: " + (data.visibleMediaIds ? data.visibleMediaIds.length : "missing"));
            }
            console.log("Loaded live visibleMediaIds:", data.visibleMediaIds.length);
          '
          echo "PHOTOSBYELIE_VISIBLE_IDS_FILE=$RUNNER_TEMP/visible-ids.json" >> "$GITHUB_ENV"
      - name: Build exact-file public candidate
        run: npm run public:build
      - name: Revalidate bytes, dependencies, catalog, identity, and forbidden paths
        run: npm run public:check
      - name: Retain the validated customer site only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-customer-${{ github.sha }}
          path: tmp/public-release/site/
          include-hidden-files: true
          if-no-files-found: error
      - name: Retain the matching receipt separately
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-customer-receipt-${{ github.sha }}
          path: tmp/public-release/receipt.json
          if-no-files-found: error

  deploy-pages:
    needs: customer-artifact
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Download validated public customer site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: public-customer-${{ github.sha }}
          path: site
      - name: Package GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - name: Deploy validated public site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
