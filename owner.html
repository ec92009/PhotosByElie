<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Photos By Elie | Owner</title>
  <meta name="description" content="Local owner controls for Photos By Elie."/>
  <link rel="icon" type="image/png" sizes="512x512" href="./assets/byelie-logo.png"/>
  <script>(()=>{try{const saved=localStorage.getItem('byelie-theme');if(saved==='light'||saved==='dark')document.documentElement.dataset.theme=saved}catch{}})();</script>
  <link rel="stylesheet" href="./shared.css?v=65.9"/>
  <link rel="stylesheet" href="./styles.css?v=65.9"/>
  <link rel="stylesheet" href="./photos.css?v=65.9"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="topbar shell">
    <nav class="version-switch" aria-label="Site navigation">
      <a href="https://ec92009.github.io/byElie/">By Elie</a> <span>|</span>
      <a href="./">Photos</a> <span>|</span>
      <a class="is-active" href="./owner.html">Owner</a>
    </nav>
    <div class="brand"><img class="site-logo" src="./assets/byelie-logo.png" alt="By Elie logo"/>PHOTOS BY ELIE - v65.9</div>
    <div class="header-controls">
      <button class="language-toggle" type="button" data-language-toggle>English</button>
      <button class="theme-toggle" type="button" data-theme-toggle><span class="mode-light">Night</span><span class="mode-dark">Day</span></button>
    </div>
  </header>
  <main id="main-content" class="shell">
    <section class="panel gallery-hero owner-hero">
      <p class="eyebrow">Localhost</p>
      <h1>Owner</h1>
      <p class="gallery-status" data-owner-status aria-live="polite"></p>
      <div class="cta">
        <a class="btn secondary" href="./">Back to collections</a>
        <a class="btn secondary" href="./unworthy.html">Unworthy</a>
      </div>
    </section>
    <section class="panel owner-panel" data-owner-root>
      <p class="empty-basket" data-owner-locked hidden>Owner controls are only available on localhost.</p>
      <div class="owner-grid" data-owner-controls>
        <article class="owner-card">
          <p class="eyebrow">Moderation</p>
          <h2>Curation Pass</h2>
          <button class="btn primary" type="button" data-owner-export>Export Curation Pass</button>
        </article>
        <article class="owner-card">
          <p class="eyebrow">Regular</p>
          <h2>Gallery cap</h2>
          <label class="owner-number-control">
            <span>Photos per collection</span>
            <input type="number" min="1" max="100" step="1" data-owner-regular-cap/>
          </label>
          <button class="btn secondary" type="button" data-owner-save-cap>Save cap</button>
        </article>
        <article class="owner-card owner-card-wide">
          <p class="eyebrow">Counts</p>
          <h2>Current state</h2>
          <dl class="owner-counts" data-owner-counts></dl>
        </article>
      </div>
    </section>
  </main>
  <script src="./photos.js?v=65.9"></script>
  <script src="./photos-data.js?v=65.9"></script>
  <script src="./unworthy-store.js?v=65.9"></script>
  <script src="./reserve-store.js?v=65.9"></script>
  <script src="./owner.js?v=65.9"></script>
</body>
</html>
