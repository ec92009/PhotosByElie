<body data-fixed-header>
  <a class="skip-link" href="#main-content" data-i18n="a11y.skip">Skip to content</a>
  <header class="topbar shell">

    </div>
  </header>
  <button class="gallery-top-button floating-back-to-top" type="button" data-header-back-to-top data-i18n-aria-label="a11y.back_to_top" aria-label="Back to top"><span aria-hidden="true">↑</span></button>
  <main id="main-content" class="shell detail-main">
    <p class="keyboard-hint detail-keyboard-hint" data-detail-shortcut-hint hidden></p>
    <section class="panel detail-layout">
      <div class="detail-preview mock-photo" data-photo-preview>
        <span data-photo-preview-title data-i18n="common.photo">Photo</span>
        <label class="like-toggle" aria-label="Like this photo" data-i18n-aria-label="a11y.like_photo">
          <input type="checkbox" data-like-toggle/>
          <span class="like-toggle-icon" aria-hidden="true"></span>
        </label>
      </div>
      <div class="detail-panel">
        <p class="eyebrow" data-photo-meta data-i18n="common.photo_detail">Photo detail</p>
        <h1 data-photo-title data-i18n="common.photo">Photo</h1>
        <dl class="photo-metadata" id="photo-metadata" data-photo-metadata hidden></dl>
      </div>
    </section>
    <section class="panel purchase-panel">
      <div>
        <h2 data-i18n="detail.pick_resolution">Pick a resolution</h2>
      </div>
      <div class="resolution-list" data-resolution-list></div>
      <div class="basket-bar detail-mobile-basket">
        <strong><span data-i18n="detail.total_selected">Total selected:</span> <span data-selection-total>$0</span></strong>
        <a class="btn primary" href="./basket.html" data-i18n="nav.basket">Basket</a>
        <a class="btn secondary" href="./liked.html" data-i18n="nav.liked">Liked</a>
      </div>
      <p class="basket-status" data-basket-status aria-live="polite"></p>
    </section>
  </main>
