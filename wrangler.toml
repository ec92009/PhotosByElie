name = "photosbyelie-checkout-mock"
main = "worker/deployed-worker.mjs"
compatibility_date = "2026-05-08"
workers_dev = true

[vars]
PUBLIC_SITE_URL = "https://photos-by-elie.com"
MOCK_STRIPE_ENABLED = "true"
KV_PREFIX = "pbe"
CHECKOUT_SESSION_TTL_DAYS = "90"
DOWNLOAD_TOKEN_TTL_DAYS = "30"
DOWNLOAD_TOKEN_MAX_DOWNLOADS = "100"
STRIPE_STATEMENT_DESCRIPTOR_SUFFIX = "DOWNLOAD"
WORKER_PUBLIC_URL = "https://photosbyelie-checkout-mock.ec92009.workers.dev"
AUTH_ALLOWED_RETURN_ORIGINS = "http://localhost:8000 http://127.0.0.1:8000"
ORDER_EMAIL_FROM = "Photos By Elie <orders@photos-by-elie.com>"
ORDER_EMAIL_REPLY_TO = "orders@photos-by-elie.com"
ORDER_EMAIL_INCLUDE_DIRECT_DOWNLOAD_LINKS = "true"
ACCESS_ADMIN_EMAIL = "ec92009@gmail.com"
ACCESS_TEAM_NAME = "byelie"
# Secret required to enable buyer delivery emails:
#   npx wrangler secret put RESEND_API_KEY
# Optional Google-backed Cloudflare Access login:
#   npx wrangler secret put ACCESS_AUD
# User tier records are stored in ORDERS_KV under pbe:access-users:<email>.
# Owner action records are stored in ORDERS_KV under pbe:owner-actions:<id>
# unless an OWNER_ACTIONS_KV binding is added later.
# Optional owner-only live checkout rehearsal discount allowlist.
# Store actual codes outside git, for example:
#   npx wrangler secret put CHECKOUT_DISCOUNT_CODES_JSON
# JSON shape:
#   [{"code":"<owner-code>","type":"target_total","targetTotalAmount":50,"label":"Owner live rehearsal"}]

[images]
binding = "IMAGES"

[[routes]]
pattern = "download.photos-by-elie.com"
custom_domain = true

[[routes]]
pattern = "auth.photos-by-elie.com"
custom_domain = true

[[kv_namespaces]]
binding = "ORDERS_KV"
id = "0ea4d21c491246c986c2c0308bebc560"
preview_id = "0896fcb030ac4f54b43756707a11a6e0"

[[r2_buckets]]
binding = "PRIVATE_MEDIA"
bucket_name = "photosbyelie-private"
preview_bucket_name = "photosbyelie-private"

[[r2_buckets]]
binding = "PUBLIC_MEDIA"
bucket_name = "photosbyelie-public"
preview_bucket_name = "photosbyelie-public"

[[r2_buckets]]
binding = "DELIVERY_MEDIA"
bucket_name = "photosbyelie-private"
preview_bucket_name = "photosbyelie-private"
