<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Photos By Elie | Photo Detail</title>
  <meta name="description" content="Mock photo detail and resolution purchase options for Photos By Elie."/>
  <link rel="icon" type="image/png" sizes="512x512" href="./assets/byelie-logo.png"/>
  <script>(()=>{try{const saved=localStorage.getItem('byelie-theme');if(saved==='light'||saved==='dark')document.documentElement.dataset.theme=saved}catch{}})();</script>
  <link rel="stylesheet" href="./shared.css?v=65.21"/>
  <link rel="stylesheet" href="./styles.css?v=65.21"/>
  <link rel="stylesheet" href="./photos.css?v=65.21"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="topbar shell">
    <nav class="version-switch" aria-label="Site navigation">
      <a href="https://ec92009.github.io/byElie/">By Elie</a> <span>|</span>
      <a href="./">Photos</a> <span>|</span>
      <a data-nav-current href="./france.html">Gallery</a>
    </nav>
    <div class="brand"><img class="site-logo" src="./assets/byelie-logo.png" alt="By Elie logo"/>PHOTOS BY ELIE - v65.21</div>
    <div class="header-controls detail-header-controls">
      <div class="mode-controls">
        <button class="language-toggle" type="button" data-language-toggle>English</button>
        <button class="theme-toggle" type="button" data-theme-toggle><span class="mode-light">Night</span><span class="mode-dark">Day</span></button>
      </div>
      <nav class="detail-cycle" aria-label="Photo navigation">
        <a class="detail-cycle-btn" data-prev-photo href="./photo.html">Previous</a>
        <a class="detail-cycle-btn" data-next-photo href="./photo.html">Next</a>
      </nav>
    </div>
  </header>
  <main id="main-content" class="shell detail-main">
    <section class="panel detail-layout">
      <div class="detail-preview mock-photo" data-photo-preview>
        <span data-photo-preview-title>Photo</span>
        <label class="like-toggle" aria-label="Like this photo">
          <input type="checkbox" data-like-toggle/>
          <span class="like-toggle-icon" aria-hidden="true"></span>
        </label>
      </div>
      <div class="detail-panel">
        <p class="eyebrow" data-photo-meta>Photo detail</p>
        <h1 data-photo-title>Photo</h1>
        <dl class="photo-metadata" data-photo-metadata hidden></dl>
        <div class="detail-actions">
          <a class="btn secondary" data-back-link href="./france.html">Back to gallery</a>
        </div>
      </div>
    </section>
    <section class="panel purchase-panel">
      <div>
        <p class="eyebrow">Resolution licenses</p>
        <h2>Choose files</h2>
      </div>
      <div class="resolution-list" data-resolution-list></div>
      <div class="basket-bar detail-mobile-basket">
        <strong>Total selected: <span data-selection-total>$0</span></strong>
        <a class="btn primary" href="./basket.html">Basket</a>
        <a class="btn secondary" href="./liked.html">Liked</a>
      </div>
      <p class="basket-status" data-basket-status aria-live="polite"></p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="shell">
      <p class="footer-note">© 2026 Photos By Elie</p>
      <nav class="footer-nav" aria-label="Footer navigation">
        <a href="https://ec92009.github.io/byElie/">By Elie</a>
        <a href="./#collections">Collections</a>
        <span class="footer-owner-tools" data-owner-tools hidden>
          <a href="./owner.html">Owner</a>
        </span>
      </nav>
    </div>
  </footer>

  <script src="./photos.js?v=65.21"></script>
  <script src="./owner-tools.js?v=65.21"></script>
  <script src="./site-version.js?v=65.21"></script>
  <script src="./photos-data.js?v=65.21"></script>
  <script src="./unworthy-store.js?v=65.21"></script>
  <script src="./reserve-store.js?v=65.21"></script>
  <script src="./basket-store.js?v=65.21"></script>
  <script src="./liked-store.js?v=65.21"></script>
  <script src="./photo-detail.js?v=65.21"></script>
  <script src="./basket-rail.js?v=65.21"></script>
</body>
</html>
