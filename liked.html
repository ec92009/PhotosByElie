<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Photos By Elie | Liked</title>
  <meta name="description" content="Local liked photos list for Photos By Elie."/>
  <link rel="icon" type="image/png" sizes="512x512" href="./assets/byelie-logo.png"/>
  <script>(()=>{try{const saved=localStorage.getItem('byelie-theme');if(saved==='light'||saved==='dark')document.documentElement.dataset.theme=saved}catch{}})();</script>
  <link rel="stylesheet" href="./shared.css?v=65.30"/>
  <link rel="stylesheet" href="./styles.css?v=65.30"/>
  <link rel="stylesheet" href="./photos.css?v=65.30"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="topbar shell">
    <nav class="version-switch" aria-label="Site navigation">
      <a href="https://ec92009.github.io/byElie/">By Elie</a> <span>|</span>
      <a href="./">Photos</a> <span>|</span>
      <a href="./basket.html">Basket</a> <span>|</span>
      <a class="is-active" href="./liked.html">Liked</a>
    </nav>
    <div class="brand"><img class="site-logo" src="./assets/byelie-logo.png" alt="By Elie logo"/>PHOTOS BY ELIE - v65.30</div>
    <div class="header-controls">
      <button class="language-toggle" type="button" data-language-toggle>English</button>
      <button class="theme-toggle" type="button" data-theme-toggle><span class="mode-light">Night</span><span class="mode-dark">Day</span></button>
    </div>
  </header>
  <aside class="basket-total-band liked-total-band shell" aria-live="polite">
    <div class="liked-bulk-actions" aria-label="Select liked photo resolutions">
      <button class="btn secondary" type="button" data-liked-select-resolution="full">Select all Full</button>
      <button class="btn secondary" type="button" data-liked-select-resolution="jpg-6mp">Select all 6 MP</button>
      <button class="btn secondary" type="button" data-liked-select-resolution="jpg-3mp">Select all 3 MP</button>
      <button class="btn secondary" type="button" data-liked-select-resolution="jpg-1mp">Select all 1 MP</button>
    </div>
    <span data-liked-total>0 files, $0</span>
  </aside>
  <main id="main-content" class="shell">
    <section class="panel gallery-hero basket-hero">
      <h1>Liked</h1>
      <div class="cta">
        <a class="btn secondary" href="./">Back to collections</a>
        <a class="btn secondary" href="./basket.html">Basket</a>
      </div>
    </section>
    <section class="panel basket-panel">
      <p class="empty-basket" data-empty-liked>No liked photos yet.</p>
      <div class="basket-list" data-liked-root></div>
      <p class="basket-status" data-liked-status aria-live="polite"></p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="shell">
      <p class="footer-note">© 2026 Photos By Elie</p>
      <nav class="footer-nav" aria-label="Footer navigation">
        <a href="https://ec92009.github.io/byElie/">By Elie</a>
        <a href="./#collections">Collections</a>
        <span class="footer-owner-tools" data-owner-tools hidden>
          <a href="./owner.html">Owner</a>
        </span>
      </nav>
    </div>
  </footer>

  <script src="./photos.js?v=65.30"></script>
  <script src="./owner-tools.js?v=65.30"></script>
  <script src="./site-version.js?v=65.30"></script>
  <script src="./photos-data.js?v=65.30"></script>
  <script src="./basket-store.js?v=65.30"></script>
  <script src="./liked-store.js?v=65.30"></script>
  <script src="./liked.js?v=65.30"></script>
</body>
</html>
